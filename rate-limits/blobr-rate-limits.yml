headers: {}
responseCodes: {}
policies: []
note: >-
  Probed 2026-08-12. No Blobr documentation host is serving content: docs.blobr.io
  resolves to hosting.gitbook.io but fails the TLS handshake, www.blobr.io returns the
  Webflow unpublished-site 404 for every path, and api.blobr.io is NXDOMAIN. There is no
  live endpoint against which a rate-limit response header could be observed and no
  reachable documentation page in which a published limit could be read. The header names
  and per-tier numbers previously recorded here were invented by the scaffold, not
  observed; asserting X-RateLimit-* on an API nobody can call is exactly the kind of
  false runtime signal an agent would act on. See lifecycle/blobr-lifecycle.yml.
