description: >-
  Honest zero. Blobr publishes no rate limits that can be read today. This file
  previously carried scaffold limits (free 10 rpm / professional 100 rpm / enterprise
  1000 rpm, plus X-RateLimit-* response headers) written by the 2026-05-04 bulk sweep.
  None of it was harvested from Blobr and none of it can be verified, so it has been
  replaced with the probe result.
limit_count: 0
